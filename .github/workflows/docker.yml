name: Test and build Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages (ffmpeg, TeX Live)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-german lmodern

      - name: Python packages
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build (and push unless pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploy the Portainer stack with the new image. Runs only for pushes to main,
  # after the image was built and pushed. Needs the repository secret
  # PORTAINER_WEBHOOK_URL (the stack's webhook URL from Portainer); without it the
  # job only notes that it was skipped.
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Portainer stack webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL is not set – skipping the redeploy."
            exit 0
          fi
          # Portainer answers 204 on success; retry briefly in case it is restarting.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 -X POST "$WEBHOOK_URL")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Portainer webhook returned HTTP $status"
            head -c 2000 response.txt
            exit 1
          fi
          echo "Portainer stack redeploy triggered (HTTP $status)."
